name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Exact package and version, for example ultimate-agent-stack@0.3.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the trusted release source.
      id-token: write # Required for npm trusted publishing with short-lived OIDC.
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.15.0 # zizmor: ignore[adhoc-packages] Exact CLI required for npm staged publishing.
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run release checks
        run: npm run release:check
      - name: Enforce ownership and license decisions
        env:
          NPM_RELEASE_MODE: staged
          PUBLISH_CONFIRM: ${{ inputs.package }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-preflight.mjs
      - name: Stage with trusted publishing
        env:
          NPM_RELEASE_MODE: staged
          PUBLISH_CONFIRM: ${{ inputs.package }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: npm stage publish --access public
  prepare-github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the commit-bound draft GitHub Release.
    steps:
      - name: Check out the exact staged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Create the commit-bound draft GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/github-release-sync.mjs prepare
