name: Sync GitHub release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: github-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the verified draft GitHub Release.
    steps:
      - name: Check out trusted default-branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install provenance-verifying npm CLI
        run: npm install --global npm@11.15.0 # zizmor: ignore[adhoc-packages] Exact CLI required for npm signature verification.
      - name: Publish registry-confirmed draft releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/github-release-sync.mjs sync
