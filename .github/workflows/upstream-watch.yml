name: Upstream watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compare pinned upstream revisions
        continue-on-error: true
        run: >-
          node bin/ultimate-agent-stack.mjs upstream-check
          --output upstream-report.json
      - name: Open or update review issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upstream-issue.mjs upstream-report.json
