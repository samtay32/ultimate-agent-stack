<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="330" viewBox="0 0 1600 330" role="img" aria-labelledby="title description">
  <title id="title">Ultimate Agent Stack delivery flow</title>
  <desc id="description">A human idea passes through shaping, planning, building, verification, independent review, and evidence before returning to the human for real-world authority.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="330" rx="24" fill="url(#background)"/>
  <text x="800" y="48" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">From idea to evidence-backed delivery</text>
  <text x="800" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Human intent and authority at the edges · guarded agent execution in the middle</text>

  <g fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M210 176 H236"/>
    <path d="M420 176 H446"/>
    <path d="M630 176 H656"/>
    <path d="M840 176 H866"/>
    <path d="M1050 176 H1076"/>
    <path d="M1260 176 H1286"/>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="30" y="116" width="180" height="120" rx="16" fill="#1f3a5f" stroke="#58a6ff" stroke-width="2"/>
      <text x="120" y="153" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="700">HUMAN</text>
      <text x="120" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Describe idea</text>
      <text x="120" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Outcome, limits, taste</text>
    </g>
    <g>
      <rect x="240" y="116" width="180" height="120" rx="16" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="330" y="153" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">SHAPE</text>
      <text x="330" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Research + lock</text>
      <text x="330" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Requirements and risk</text>
    </g>
    <g>
      <rect x="450" y="116" width="180" height="120" rx="16" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="540" y="153" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">PLAN</text>
      <text x="540" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Vertical slices</text>
      <text x="540" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Small, testable outcomes</text>
    </g>
    <g>
      <rect x="660" y="116" width="180" height="120" rx="16" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="750" y="153" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">BUILD</text>
      <text x="750" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Code + tests</text>
      <text x="750" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Project-native tools</text>
    </g>
    <g>
      <rect x="870" y="116" width="180" height="120" rx="16" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="960" y="153" text-anchor="middle" fill="#7ee787" font-size="14" font-weight="700">VERIFY</text>
      <text x="960" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Fail closed</text>
      <text x="960" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Checks and security</text>
    </g>
    <g>
      <rect x="1080" y="116" width="180" height="120" rx="16" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="1170" y="153" text-anchor="middle" fill="#7ee787" font-size="14" font-weight="700">REVIEW</text>
      <text x="1170" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Independent eyes</text>
      <text x="1170" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Standards + intent</text>
    </g>
    <g>
      <rect x="1290" y="116" width="280" height="120" rx="16" fill="#1e4620" stroke="#3fb950" stroke-width="2"/>
      <text x="1430" y="153" text-anchor="middle" fill="#7ee787" font-size="14" font-weight="700">EVIDENCE + HUMAN</text>
      <text x="1430" y="183" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Approve real-world action</text>
      <text x="1430" y="210" text-anchor="middle" fill="#c9d1d9" font-size="14">Merge, deploy, spend, publish</text>
    </g>
  </g>

  <text x="800" y="286" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Every stage leaves durable repository state, explicit decisions, and reproducible evidence.</text>
</svg>
