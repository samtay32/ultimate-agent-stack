<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610" role="img" aria-labelledby="title description">
  <title id="title">Ultimate Agent Stack synthesis map</title>
  <desc id="description">Research from workflow, specification, interface, review, and scaling projects is filtered through original engineering into a guarded CLI, eight skills, durable artifacts, and a protected release process.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1500" height="610" rx="24" fill="url(#background)"/>
  <text x="750" y="47" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">Pattern research to deliberate tradeoffs to one original operating system</text>
  <text x="750" y="78" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Ideas were evaluated and re-engineered; third-party source code is not bundled.</text>

  <g fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M390 159 C470 159 480 228 555 228"/>
    <path d="M390 260 C470 260 480 272 555 272"/>
    <path d="M390 361 C470 361 480 316 555 316"/>
    <path d="M390 462 C470 462 480 360 555 360"/>
    <path d="M945 240 C1020 240 1025 184 1100 184"/>
    <path d="M945 304 H1100"/>
    <path d="M945 368 C1020 368 1025 424 1100 424"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="55" y="116" width="335" height="86" rx="15" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="78" y="148" fill="#d2a8ff" font-size="14" font-weight="700">DURABLE DELIVERY</text>
      <text x="78" y="177" fill="#f0f6fc" font-size="19" font-weight="700">Firstmate · no-mistakes</text>
    </g>
    <g>
      <rect x="55" y="217" width="335" height="86" rx="15" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="78" y="249" fill="#d2a8ff" font-size="14" font-weight="700">SHAPING + SPECIFICATION</text>
      <text x="78" y="278" fill="#f0f6fc" font-size="19" font-weight="700">spec-kit · mattpocock/skills</text>
    </g>
    <g>
      <rect x="55" y="318" width="335" height="86" rx="15" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="78" y="350" fill="#d2a8ff" font-size="14" font-weight="700">SCALE + FIDELITY</text>
      <text x="78" y="379" fill="#f0f6fc" font-size="19" font-weight="700">bmad-method · lavish-axi</text>
    </g>
    <g>
      <rect x="55" y="419" width="335" height="86" rx="15" fill="#182433" stroke="#30363d" stroke-width="2"/>
      <text x="78" y="451" fill="#d2a8ff" font-size="14" font-weight="700">AGENT INTERFACES + EVALUATION</text>
      <text x="78" y="480" fill="#f0f6fc" font-size="19" font-weight="700">axi · supporting repository audit</text>
    </g>

    <g>
      <rect x="555" y="142" width="390" height="304" rx="24" fill="url(#core)" stroke="#79c0ff" stroke-width="3"/>
      <text x="750" y="184" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">ORIGINAL SYNTHESIS</text>
      <text x="750" y="223" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">Ultimate Agent Stack</text>
      <line x1="610" x2="890" y1="246" y2="246" stroke="#8cafff" stroke-width="1"/>
      <text x="620" y="281" fill="#fff" font-size="17">• risk-adaptive conversation</text>
      <text x="620" y="316" fill="#fff" font-size="17">• containment + approval integrity</text>
      <text x="620" y="351" fill="#fff" font-size="17">• project-native evidence model</text>
      <text x="620" y="386" fill="#fff" font-size="17">• safe upgrades + maintenance policy</text>
      <text x="750" y="424" text-anchor="middle" fill="#c6d8ff" font-size="14">Adopt useful patterns · reject unnecessary machinery</text>
    </g>

    <g>
      <rect x="1100" y="137" width="340" height="94" rx="16" fill="#163d2a" stroke="#3fb950" stroke-width="2"/>
      <text x="1125" y="171" fill="#7ee787" font-size="14" font-weight="700">PORTABLE CORE</text>
      <text x="1125" y="202" fill="#f0f6fc" font-size="20" font-weight="700">Dependency-free CLI + 8 skills</text>
    </g>
    <g>
      <rect x="1100" y="257" width="340" height="94" rx="16" fill="#163d2a" stroke="#3fb950" stroke-width="2"/>
      <text x="1125" y="291" fill="#7ee787" font-size="14" font-weight="700">DURABLE PROJECT MEMORY</text>
      <text x="1125" y="322" fill="#f0f6fc" font-size="20" font-weight="700">Policy · decisions · evidence</text>
    </g>
    <g>
      <rect x="1100" y="377" width="340" height="94" rx="16" fill="#163d2a" stroke="#3fb950" stroke-width="2"/>
      <text x="1125" y="411" fill="#7ee787" font-size="14" font-weight="700">CONTROLLED DELIVERY</text>
      <text x="1125" y="442" fill="#f0f6fc" font-size="20" font-weight="700">Verified change · review · release</text>
    </g>
  </g>

  <text x="750" y="557" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Full revisions, accepted patterns, rejected complexity, videos, and platform references live in docs/SOURCES_AND_TRADEOFFS.md.</text>
</svg>
